[project]
name = "workorder"
version = "0.1.0"
description = "Mac desktop app for maintenance work orders."
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8"]

[project.scripts]
workorder = "workorder.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
